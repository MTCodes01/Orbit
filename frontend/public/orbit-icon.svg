<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181824" />
      <stop offset="100%" stop-color="#09090d" />
    </radialGradient>
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#27273a" stroke-width="4" />

  <!-- Outer Orbit Ellipse -->
  <ellipse cx="256" cy="256" rx="180" ry="85" fill="none" stroke="url(#ringGrad1)" stroke-width="8" stroke-dasharray="14 10" transform="rotate(-30 256 256)" filter="url(#glow)" opacity="0.85" />

  <!-- Inner Orbit Ellipse -->
  <ellipse cx="256" cy="256" rx="145" ry="65" fill="none" stroke="url(#ringGrad2)" stroke-width="6" transform="rotate(40 256 256)" filter="url(#glow)" opacity="0.9" />

  <!-- Ambient Glow Behind Core -->
  <circle cx="256" cy="256" r="80" fill="url(#coreGlow)" opacity="0.5" />

  <!-- Center Core (Trackpad / Nucleus) -->
  <circle cx="256" cy="256" r="42" fill="#0f172a" stroke="#38bdf8" stroke-width="5" filter="url(#glow)" />
  <circle cx="256" cy="256" r="22" fill="#38bdf8" opacity="0.9" />
  <circle cx="256" cy="256" r="10" fill="#ffffff" />

  <!-- Orbiting Nodes / Satellite Laptops -->
  <circle cx="120" cy="190" r="14" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="120" cy="190" r="6" fill="#ffffff" />

  <circle cx="395" cy="320" r="16" fill="#c084fc" filter="url(#glow)" />
  <circle cx="395" cy="320" r="7" fill="#ffffff" />

  <circle cx="330" cy="150" r="12" fill="#34d399" filter="url(#glow)" />
  <circle cx="330" cy="150" r="5" fill="#ffffff" />
</svg>
